services:
  - type: web
    name: gk-shoppy
    env: docker
    repo: https://github.com/gowtham009/gkshoppy-react2.0
    branch: main
    plan: free
    dockerfilePath: Dockerfile
    envVars:
      - key: VITE_API_URL
        fromSecret: VITE_API_URL
      - key: VITE_AWS_REGION
        value: us-east-1
      - key: VITE_COGNITO_CLIENT_ID
        fromSecret: VITE_COGNITO_CLIENT_ID
