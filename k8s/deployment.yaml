apiVersion: apps/v1
kind: Deployment
metadata:
  name: gkshoppy-deployment
  namespace: gkshoppy
spec:
  replicas: 2
  selector:
    matchLabels:
      app: gkshoppy
  template:
    metadata:
      labels:
        app: gkshoppy
    spec:
      containers:
        - name: gkshoppy
          image: REPLACE_IMAGE
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: gkshoppy-config
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:
            requests:
              cpu: "250m"
              memory: "256Mi"
            limits:
              cpu: "1000m"
              memory: "1Gi"
